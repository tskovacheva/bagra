    overflow:hidden;max-width:none;
  }
  .grid td.clip::before,.grid td.longcell::before{width:auto;display:block}
  .grid .num{text-align:left}
  /* The panel no longer holds anything wider than itself, so the sideways
     scroll put there as a stopgap in §13o is removed with the cause. */
  .panel.flush{overflow-x:visible}
  .panel.flush .grid{padding:12px}
}

/* A control is what changes the screen when it is pressed, and below 640px it
   is sized for a finger: 44px, the width of an adult fingertip. At a desk a
   19px star is a small mouse target; in a wet hand in a garden it is not a
   target at all, and this application is used in a garden.

   What is NOT here, deliberately: `.chip`. A chip is a `<span>` — the
   conditions under a reference result, a technique's category, a plant's
   precautions. It names something and does nothing when pressed, so making it
   44px tall would be sizing prose for a finger. `.box` — the role filter in
   plants, the state filter in fabrics — is a `<button>` that changes what the
   list shows, and it is the thing rule 3 (§13s) means by a chip. The two look
   alike and behave nothing alike; they are told apart here by what they do, and
   `check.sh` refuses a `.chip` that is a button or a `.box` that is not. */
@media (max-width:640px){
  /* The header actions were one unwrapping row. On the reference records tab —
     a two-tab switch beside two buttons — it ran 13px past the edge and the tab
     switch itself clipped, so "Записи" was half a word. Nobody had seen it:
     `#/reference/records` showed the search tab until §13ad gave the module an
     open(), so the address existed and the screen behind it did not. */
  .pageactions{flex-wrap:wrap}
  .tabswitch{flex:1 1 100%}
  .tabswitch .tab{flex:1}
  .btn,.tab,.box,.fav,.moreitem,.bottomnav button,
  input:not([type=checkbox]):not([type=radio]),select,textarea{
    min-height:44px;
  }
  .btn,.tab,.box{display:inline-flex;align-items:center;justify-content:center}
  .box{align-items:center}
  /* The star is square: a 44px-tall target 22px wide is still missed. */
  .fav{min-width:44px}
  /* A checkbox cannot be stretched, so the label around it carries the target.
     Every checkbox in the application already sits in a `label.check` except
     the fabric selection box, which is the seed of the bulk actions and now has
     one of its own. */
  label:has(> input[type=checkbox]),label:has(> input[type=radio]),.pickbox{
    display:inline-flex;align-items:center;min-height:44px;
  }
  .pickbox{justify-content:center;min-width:44px}
}

.moresheet{
  position:fixed;inset:0;background:rgba(42,39,36,.4);
  display:flex;align-items:flex-end;z-index:50;
}
.morepanel{
  background:var(--surface);width:100%;
  border-top-left-radius:16px;border-top-right-radius:16px;
  padding:18px 14px calc(18px + env(safe-area-inset-bottom));
  max-height:82vh;overflow:auto;
}
.morehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.morehead h2{margin:0}
.moregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moreitem{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:14px 6px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--ground);cursor:pointer;font-size:12px;color:var(--ink);text-align:center;
}
.moreitem svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.moreitem[aria-current="page"]{border-color:var(--indigo);color:var(--indigo)}
.morelang{display:flex;gap:6px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- Icon sprite. Real SVG, distinct silhouettes — never dingbats (§15.4). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Filter marks. One per code, in the chrome palette. A mark stands beside
         its label and never replaces it: a picture alone cannot be read aloud,
         searched, or understood by someone meeting the app for the first time. -->

    <!-- fabric_state — the life of a piece of cloth, in order -->
    <symbol id="s-unwashed" viewBox="0 0 24 24"><path d="M5 6.5c3-2 5-2 7 0s4 2 7 0v11c-3 2-5 2-7 0s-4-2-7 0Z"/></symbol>
    <symbol id="s-scoured" viewBox="0 0 24 24"><path d="M5 8.5c2.5-2 4.5-2 7 0s4.5 2 7 0"/><path d="M5 13c2.5-2 4.5-2 7 0s4.5 2 7 0"/><path d="M5 17.5c2.5-2 4.5-2 7 0s4.5 2 7 0"/></symbol>
    <symbol id="s-mordanted" viewBox="0 0 24 24"><path d="M12 3.5 19 8v8l-7 4.5L5 16V8Z"/><path d="M12 9.5v5M9.5 12h5"/></symbol>
    <symbol id="s-dyed" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="s-finished" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.6 2.6 4.6-5.2"/></symbol>

    <!-- material_category — what a substance is for -->
    <symbol id="c-mordant" viewBox="0 0 24 24"><path d="M12 3.5 19 8v8l-7 4.5L5 16V8Z"/></symbol>
    <symbol id="c-tannin" viewBox="0 0 24 24"><path d="M12 21V9"/><path d="M12 9c0-3.3 2.4-5.8 5.8-5.8 0 3.4-2.5 5.8-5.8 5.8Z"/><path d="M12 13c0-2.8-2-4.7-4.7-4.7 0 2.8 1.9 4.7 4.7 4.7Z"/></symbol>
    <symbol id="c-dyestuff" viewBox="0 0 24 24"><path d="M6 10.5h12l-1.2 8a2 2 0 0 1-2 1.7H9.2a2 2 0 0 1-2-1.7Z"/><path d="M9.5 10.5V6a2.5 2.5 0 0 1 5 0v4.5"/></symbol>
    <symbol id="c-modifier" viewBox="0 0 24 24"><path d="M4 15.5h16"/><path d="M7 15.5V11M12 15.5V7M17 15.5v-6"/><path d="M4 19.5h16"/></symbol>
    <symbol id="c-auxiliary" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></symbol>

    <!-- technique_category -->
    <symbol id="k-resist" viewBox="0 0 24 24"><path d="M12 3.5 19.5 7v6c0 4-3.2 6.8-7.5 8-4.3-1.2-7.5-4-7.5-8V7Z"/></symbol>
