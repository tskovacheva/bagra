<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EC">
<title>Багра</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --ground:#F7F4EC;
  --surface:#FFFDF8;
  --ink:#2A2724;
  --muted:#5C574E;
  --line:#DED8CA;
  --indigo:#2C3B57;
  --madder:#A03D3B;
  --weld:#C9A227;
  --iron:#3A3733;

  --sidebar:236px;
  --pad:20px;
  --radius:8px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  color:var(--ink);
  background:var(--ground);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}

.sidebar{
  width:var(--sidebar);
  flex:0 0 var(--sidebar);
  border-right:1px solid var(--line);
  background:var(--surface);
  padding:22px 12px;
  display:flex;
  flex-direction:column;
  gap:2px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{padding:0 10px 20px;display:flex;flex-direction:column;gap:2px}
.brand b{font-size:19px;font-weight:600;letter-spacing:.01em}
.brand span{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

.navitem{
  display:flex;align-items:center;gap:11px;
  padding:8px 10px;
  border:0;background:none;
  border-radius:var(--radius);
  cursor:pointer;text-align:left;width:100%;
  color:var(--muted);
}
.navitem svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.navitem:hover{background:var(--ground);color:var(--ink)}
.navitem[aria-current="page"]{background:var(--indigo);color:#fff}
.navitem:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}

.navgap{flex:1}
.langrow{display:flex;gap:4px;padding:10px 10px 0;border-top:1px solid var(--line);margin-top:10px}
.langbtn{
  border:1px solid var(--line);background:var(--surface);
  border-radius:6px;padding:3px 9px;font-size:12px;color:var(--muted);cursor:pointer;
}
.langbtn[aria-pressed="true"]{border-color:var(--indigo);color:var(--indigo)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.view{padding:26px var(--pad) 60px;max-width:1080px;width:100%}

h1{font-size:23px;font-weight:600;margin:0 0 3px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
}
.stub{color:var(--muted);font-size:13.5px}
.stub code{background:var(--ground);padding:1px 5px;border-radius:4px;font-size:12.5px}

/* ---------- bottom nav (narrow) ---------- */
.bottomnav{display:none}

@media (max-width:820px){
  .sidebar{display:none}
  .view{padding:18px 14px calc(72px + env(safe-area-inset-bottom))}
  .bottomnav{
    display:flex;
    position:fixed;left:0;right:0;bottom:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    justify-content:space-around;
    z-index:10;
  }
  .bottomnav button{
    border:0;background:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px 8px;border-radius:var(--radius);
    font-size:10.5px;color:var(--muted);
  }
  .bottomnav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .bottomnav button[aria-current="page"]{color:var(--indigo)}
}


/* ---------- page furniture ---------- */
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pagehead h1{margin:0}
.pagehead .sub{margin:3px 0 0}
.pageactions{display:flex;gap:8px}

h2{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}

.btn{
  border:1px solid var(--line);background:var(--surface);
  border-radius:6px;padding:7px 13px;cursor:pointer;font-size:14px;
}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.quiet{background:none;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{background:var(--ground);color:var(--ink)}
.btn.danger{color:var(--madder)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}

.panel{margin-bottom:0}
.panel.flush{padding:0;overflow:hidden}

/* ---------- forms ---------- */
.field{display:block;margin-bottom:13px}
.fieldlabel{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:7px 9px;font:inherit;font-size:14px;color:var(--ink);
  background:var(--ground);border:1px solid var(--line);border-radius:6px;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--indigo);outline-offset:-1px;border-color:var(--indigo)}
textarea{resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- composition rows ---------- */
.comprow{display:grid;grid-template-columns:1fr 86px auto auto;gap:7px;align-items:center;margin-bottom:7px}
.comprow .pct{color:var(--muted);font-size:13px}
.derived{margin-top:12px}
.note{font-size:13px;color:var(--muted);background:var(--ground);border-radius:6px;padding:8px 10px;margin:0 0 7px}
.note.warn{border-left:3px solid var(--weld)}
.note.error{border-left:3px solid var(--madder);color:var(--ink)}

/* ---------- boxes (the fabric state inventory) ---------- */
.boxes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.box{
  display:flex;align-items:baseline;gap:8px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);
  border-radius:var(--radius);padding:8px 13px;
}
.box:hover{border-color:var(--muted)}
.box.active{border-color:var(--indigo);background:var(--indigo);color:#fff}
.boxname{font-size:13.5px}
.boxcount{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.box.active .boxcount{color:rgba(255,255,255,.75)}

/* ---------- tables ---------- */
.grid{width:100%;border-collapse:collapse;font-size:14px}
.grid th{
  text-align:left;font-weight:500;font-size:12px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);
  padding:11px 14px;border-bottom:1px solid var(--line);
}
.grid td{padding:11px 14px;border-bottom:1px solid var(--line)}
.grid tbody tr:last-child td{border-bottom:0}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover{background:var(--ground)}
.grid .num{text-align:right;font-variant-numeric:tabular-nums}

.chip{
  display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;
  background:var(--ground);border:1px solid var(--line);color:var(--muted);
}

.history{list-style:none;margin:0 0 14px;padding:0;font-size:13.5px}
.history li{padding:6px 0;border-bottom:1px solid var(--line)}
.history li:last-child{border-bottom:0}
.addstate{border-top:1px solid var(--line);padding-top:12px}

.emptystate{padding:40px 20px;text-align:center;color:var(--muted)}
.emptystate p{margin:0 0 6px}


/* ---------- checkboxes ---------- */
.checks{display:flex;flex-wrap:wrap;gap:12px}
.check{display:flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer;margin:4px 0}
.check input{width:auto;margin:0}

/* ---------- bilingual pair field ---------- */
.pairfield .untranslated{
  display:inline-block;margin-left:7px;font-size:10.5px;letter-spacing:.03em;
  color:var(--weld);border:1px solid var(--weld);border-radius:20px;padding:0 6px;
  text-transform:none;
}
.pairalt{margin-top:6px}
.pairalt summary{
  font-size:12px;color:var(--muted);cursor:pointer;list-style:none;
  padding:3px 0;user-select:none;
}
.pairalt summary::-webkit-details-marker{display:none}
.pairalt summary::before{content:"▸ ";font-size:10px}
.pairalt[open] summary::before{content:"▾ "}
.pairalt textarea,.pairalt input{margin-top:4px}


/* ---------- calculators ---------- */
.calcpane{max-width:520px}
.calcwhen{font-size:13.5px;color:var(--muted);margin:-6px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.btnrow{display:flex;gap:8px;margin:12px 0}
.rule{border:0;border-top:1px solid var(--line);margin:18px 0}
.subhead{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
label.btn{cursor:pointer}
.calcresults{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.calcout{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0}
.calclabel{font-size:13px;color:var(--muted)}
.calcvalue{font-size:17px;font-variant-numeric:tabular-nums;color:var(--indigo);font-weight:600}
.calcvalue small{font-size:12px;font-weight:400;color:var(--muted)}


/* ---------- recipe ingredient and step rows ---------- */
.ingrow{border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:9px;background:var(--ground)}
.ingmain{display:grid;grid-template-columns:1fr 1.3fr auto;gap:7px;margin-bottom:7px}
.ingdetail{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.optblock{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.optlabel{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.orsep{display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.orsep::before,.orsep::after{content:"";flex:1;height:1px;background:var(--line)}
.orsep span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.optrow{display:grid;grid-template-columns:1.4fr 70px 70px 1.2fr auto;gap:6px;margin-bottom:6px}
.optrow input,.optrow select{font-size:13px;padding:5px 7px}
.followrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.followrow:last-child{border-bottom:0}
.calcpick select{font-size:13px;padding:4px 6px;max-width:230px}
.ingdetail input,.ingdetail select{font-size:13px;padding:5px 7px}

.steprow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;margin-bottom:8px}
.stepnum{
  width:22px;height:22px;border-radius:50%;background:var(--indigo);color:#fff;
  font-size:11.5px;display:flex;align-items:center;justify-content:center;margin-top:6px;
}
@media (max-width:700px){
  .ingmain{grid-template-columns:1fr auto}
  .ingdetail{grid-template-columns:1fr}
  .optrow{grid-template-columns:1fr 1fr}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Основна навигация"></nav>
  <div class="main"><main class="view" id="view" tabindex="-1"></main></div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Основна навигация"></nav>

<script type="module" src="app.js"></script>
</body>
</html>
